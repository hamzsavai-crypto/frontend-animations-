<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0D12" />
    <meta
      name="description"
      content="Physics Lab — a premium interactive physics education platform. Understand physics by playing with it: live simulations of projectile motion, harmonic motion and optics."
    />
    <meta name="keywords" content="physics, interactive simulations, education, projectile motion, simple harmonic motion, optics, physics lab" />

    <!-- Fonts: Bricolage Grotesque (display). Geist Sans/Mono are
         self-hosted from node_modules in src/css/fonts.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon-lab.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="shortcut icon" href="/favicon-lab.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Physics Lab" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Physics Lab — Understand physics by playing with it" />
    <meta
      property="og:description"
      content="A premium interactive physics education platform. Live simulations of projectile motion, harmonic motion and optics."
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Physics Lab" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Physics Lab — Understand physics by playing with it" />
    <meta
      name="twitter:description"
      content="A premium interactive physics education platform. Live simulations of projectile motion, harmonic motion and optics."
    />

    <meta name="robots" content="index, follow" />
    <title>Physics Lab — Understand physics by playing with it</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
